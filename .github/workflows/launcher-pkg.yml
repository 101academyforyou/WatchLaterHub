name: launcher-pkg

# 產生 Mac 的電腦小幫手安裝檔，放到 GitHub Release「launcher-latest」
# 新分頁的「下載小幫手」按鈕下載的就是這個檔案：
#   https://github.com/<owner>/<repo>/releases/download/launcher-latest/WatchLaterHub-Launcher.pkg
on:
  push:
    branches: [main]
    paths: ['launcher/**', '.github/workflows/launcher-pkg.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    env:
      # step 的 if 不能直接讀 secrets，先轉成是否有設定
      HAS_CERT: ${{ secrets.MAC_INSTALLER_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Test helper
        run: cargo test --release --manifest-path launcher/Cargo.toml
      # 有設定 Apple 憑證（secrets）才簽署與公證；沒有就產生未簽署的安裝檔
      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_INSTALLER_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
        run: |
          echo "$MAC_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
      - name: Store notary credentials
        if: env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: xcrun notarytool store-credentials watchlaterhub --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
      - name: Build .pkg
        env:
          SIGN_ID: ${{ secrets.MAC_INSTALLER_SIGN_ID }}
          NOTARY_PROFILE: ${{ env.HAS_NOTARY == 'true' && 'watchlaterhub' || '' }}
        run: ./launcher/build-pkg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WatchLaterHub-Launcher
          path: dist/WatchLaterHub-Launcher.pkg
      - name: Publish to release "launcher-latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-latest
          name: 電腦小幫手（Mac 安裝檔）
          body: |
            WatchLaterHub「開啟」功能需要的電腦小幫手。下載後雙擊 WatchLaterHub-Launcher.pkg 安裝，裝好後回到新分頁按「重新偵測」。
            移除：sudo "/Library/Application Support/WatchLaterHub/uninstall.sh"
          files: dist/WatchLaterHub-Launcher.pkg
          overwrite_files: true
          make_latest: false
